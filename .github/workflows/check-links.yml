name: Comprobación de enlaces

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 1 * *" # mensual, para detectar enlaces que se rompan con el tiempo
  workflow_dispatch:

jobs:
  lychee:
    name: Comprobar enlaces
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      - name: Comprobar enlaces
        uses: lycheeverse/lychee-action@v2
        with:
          # Fuentes del libro: Markdown y notebooks. --fallback-extensions md
          # resuelve las referencias cruzadas de MyST sin extensión.
          args: --no-progress --fallback-extensions md "./**/*.md" "./**/*.ipynb"
          fail: true
        env:
          # Las peticiones autenticadas evitan los límites de uso de GitHub.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
