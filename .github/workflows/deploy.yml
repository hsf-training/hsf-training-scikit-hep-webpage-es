name: Construcción y despliegue del libro

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  BASE_URL: /${{ github.event.repository.name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-book:
    name: Construir el libro
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Necesario para que miniconda active conda
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7
      - name: Instalar conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: "3.12"
          miniforge-version: latest
          use-mamba: true
          environment-file: environment.yml
          activate-environment: skhep-tutorial
          conda-remove-defaults: true
      - name: Construir el libro
        run: |
          pip install --pre "jupyter-book==2.*"
          jupyter book build --execute --strict --html --ci
      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_build/html"

  deploy-book:
    name: Desplegar el libro
    runs-on: ubuntu-latest
    needs: build-book
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
